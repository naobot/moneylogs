<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RowButton</title>
  </head>
  <body>
    <div class="pv">
      <div class="pv-row">
        <button class="RowButton">Edit</button><button class="RowButton">Unarchive</button
        ><button class="RowButton" disabled>Delete</button>
      </div>
      <div class="pv-row">
        <button class="RowButton RowButton--glyph" aria-label="Previous month">‹</button
        ><span class="num">mar 2026</span
        ><button class="RowButton RowButton--glyph" aria-label="Next month">›</button
        ><button class="RowButton">Today</button>
      </div>
    </div>
  </body>
</html>
