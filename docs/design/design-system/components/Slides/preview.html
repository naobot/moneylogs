<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slides</title>
  </head>
  <body>
    <div class="pv" style="max-width: 380px">
      <div class="Slides" role="dialog" aria-label="what's a sublog?">
        <div class="Slides__head">what's a sublog?<button aria-label="Close">×</button></div>
        <section class="Slides__slide">
          <h3 class="Slides__heading">one log can feed another</h3>
          <p class="Slides__text">
            A sublog is an ordinary log whose spending also counts as one category in another log,
            its parent.
          </p>
          <p class="Slides__example">
            <strong>For example:</strong> Mia freelances on the side. Her business log has its own
            categories. In her personal log, all of it is one line: business, $430.
          </p>
        </section>
        <div class="Slides__foot">
          <span class="Slides__dots" aria-label="slide 1 of 7"
            ><span class="Slides__dot Slides__dot--on"></span><span class="Slides__dot"></span
            ><span class="Slides__dot"></span><span class="Slides__dot"></span
            ><span class="Slides__dot"></span><span class="Slides__dot"></span
            ><span class="Slides__dot"></span></span
          ><button class="TextButton">skip</button
          ><button
            class="Button Button--primary-border"
            style="min-height: 44px; background: var(--sheet)"
          >
            <strong>Next</strong>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
