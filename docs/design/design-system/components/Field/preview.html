<!-- @dsCard group="Inputs" height=300 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Field</title>
  </head>
  <body>
    <div
      class="pv"
      style="font-family: var(--font-mono, Hack, monospace); color: var(--ink); font-size: 14px"
    >
      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12px;
          color: var(--ink-muted);
          max-width: 320px;
        "
        >log name<input
          value="household"
          style="
            height: 44px;
            padding: 0 12px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            border: 1px dashed var(--ink);
            border-radius: 0;
            background: var(--sheet);
          "
      /></label>
      <div style="height: 12px"></div>
      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12px;
          color: var(--ink-muted);
          max-width: 320px;
        "
        >amount<span
          style="
            display: flex;
            height: 44px;
            border: 1px dashed var(--ink);
            background: var(--sheet);
          "
          ><span
            style="
              display: flex;
              align-items: center;
              padding: 0 10px;
              border-right: 1px solid var(--ink);
              color: var(--ink);
              font-weight: 700;
            "
            >JPY ▾</span
          ><input
            value="2,180"
            style="
              flex-grow: 1;
              min-width: 0;
              padding: 0 12px;
              font: inherit;
              font-size: 16px;
              font-weight: 700;
              text-align: right;
              color: var(--ink);
              border: 0;
              background: transparent;
            " /></span
      ></label>
      <div style="height: 12px"></div>
      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 12px;
          color: var(--ink-muted);
          max-width: 320px;
        "
        >error<input
          value=""
          aria-invalid="true"
          style="
            height: 44px;
            padding: 0 10px;
            font: inherit;
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 0;
            background: var(--sheet);
          "
        /><span style="color: var(--ink)"><strong>!</strong> give the log a name</span></label
      >
    </div>
  </body>
</html>
