<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Steps</title>
  </head>
  <body>
    <div class="pv" style="font-family: var(--font-mono, Hack, monospace); color: var(--ink)">
      <ol
        aria-label="Steps"
        style="
          display: grid;
          grid-template-columns: repeat(4, 64px);
          margin: 0;
          padding: 0;
          list-style: none;
        "
      >
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span
            style="
              width: 28px;
              height: 28px;
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid var(--ink);
              font-size: 12px;
              font-weight: 700;
            "
            >1</span
          ><span style="font-size: 11px">type</span>
        </li>
        <li
          aria-current="step"
          style="display: flex; flex-direction: column; align-items: center; gap: 2px"
        >
          <span
            style="
              width: 28px;
              height: 28px;
              display: flex;
              align-items: center;
              justify-content: center;
              background: var(--inverse-surface);
              color: var(--inverse-ink);
              font-size: 12px;
              font-weight: 700;
            "
            >2</span
          ><strong style="font-size: 11px">details</strong>
        </li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span
            style="
              width: 28px;
              height: 28px;
              box-sizing: border-box;
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px dashed var(--ink);
              font-size: 12px;
            "
            >3</span
          ><span style="font-size: 11px; color: var(--ink-muted)">members</span>
        </li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span
            style="
              width: 28px;
              height: 28px;
              box-sizing: border-box;
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px dashed var(--ink);
              font-size: 12px;
            "
            >4</span
          ><span style="font-size: 11px; color: var(--ink-muted)">review</span>
        </li>
      </ol>
    </div>
  </body>
</html>
