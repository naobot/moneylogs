<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snackbar</title>
  </head>
  <body>
    <div class="pv" style="max-width: 380px">
      <div class="Snackbar__item" role="status">
        <span class="Snackbar__mark" aria-hidden="true">✓</span
        ><span class="Snackbar__message">Sent to mika: “proud of you”</span
        ><button class="Snackbar__close" aria-label="Close">×</button>
      </div>
      <div class="Snackbar__item" role="status">
        <span class="Snackbar__mark" aria-hidden="true">✓</span
        ><span class="Snackbar__message">You're friends now</span
        ><button class="Snackbar__close" aria-label="Close">×</button>
      </div>
      <div class="Snackbar__item Snackbar__item--error" role="alert">
        <span class="Snackbar__mark"
          ><img src="/_blob/cdfcc2cb76bbfb1a0fc09fd2c05f51c9" alt="" /></span
        ><span class="Snackbar__message">Couldn't save that. Please try again.</span
        ><button class="Snackbar__close" aria-label="Close">×</button>
      </div>
    </div>
  </body>
</html>
