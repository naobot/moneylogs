<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Disclosure</title>
  </head>
  <body>
    <div
      class="pv"
      style="font-family: var(--font-mono, Hack, monospace); color: var(--ink); font-size: 14px"
    >
      <div style="max-width: 360px">
        <button
          aria-expanded="false"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 44px;
            padding: 0;
            font: inherit;
            color: var(--ink);
            background: none;
            border: 0;
          "
        >
          <span>[+] scheduled payments</span
          ><span style="font-size: 12px; color: var(--ink-muted)">3</span>
        </button>
        <button
          aria-expanded="true"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 44px;
            padding: 0;
            font: inherit;
            color: var(--ink);
            background: none;
            border: 0;
          "
        >
          <span>[-] breakdown</span
          ><span style="font-size: 12px; color: var(--ink-muted)">4 categories</span>
        </button>
        <div style="padding: 4px 0 4px 14px; border-left: 1px dotted var(--ink); font-size: 13px">
          groceries · 38%<br />dining out · 22%
        </div>
      </div>
    </div>
  </body>
</html>
