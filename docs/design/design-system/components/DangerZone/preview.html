<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DangerZone</title>

  <body>
    <div

      style="

        color: var(--ink);

      "
    >
      <section
        style="
          display: flex;
          flex-direction: column;

          style="
            align-self: flex-start;

            padding: 0 14px;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink);
            border: 3px solid var(--ink);
            background: var(--sheet);
          "
        >
          delete…

      </section>
