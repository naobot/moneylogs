<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review, banner and toast on wide screens</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
          }
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
          }
          body {
            margin: 0;
          }
          a {
            color: #242424;
          }
          a:hover {
            color: #000;
          }
          @keyframes bounce {
            0%,
            100% {
              transform: translateY(0);
            }
            40% {
              transform: translateY(-4px);
            }
            70% {
              transform: translateY(1px);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .bounce {
              animation: none !important;
            }
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 1440px;
          height: 900px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          background: #f5f3f0;
          color: #242424;
          font-family: Hack, ui-monospace, Menlo, monospace;
          font-size: 15px;
          line-height: 1.5;
        "
      >
        <nav
          aria-label="Main"
          style="
            display: flex;
            align-items: center;
            gap: 16px;
            height: 52px;
            padding: 0 16px;
            border-bottom: 1px solid #242424;
            flex-shrink: 0;
          "
        >
          <div style="display: flex">
            <a
              href="#"
              aria-label="Home"
              style="
                display: inline-flex;
                width: 44px;
                height: 44px;
                align-items: center;
                justify-content: center;
              "
              ><img
                src="/_blob/f2fd515f0bede2b0ca5b192ed6b45158"
                alt=""
                width="22"
                height="22"
                style="display: block; flex-shrink: 0"
            /></a>
            <a
              href="#"
              aria-label="My preferences"
              style="
                display: inline-flex;
                width: 44px;
                height: 44px;
                align-items: center;
                justify-content: center;
              "
              ><img
                src="/_blob/640a26c714e2a3c742076631aaf9bd19"
                alt=""
                width="22"
                height="22"
                style="display: block; flex-shrink: 0"
            /></a>
            <a
              href="#"
              aria-label="Notifications"
              style="
                display: inline-flex;
                width: 44px;
                height: 44px;
                align-items: center;
                justify-content: center;
              "
              ><img
                src="/_blob/64a2d48d8057f5b21a0e2df0e1a8dccb"
                alt=""
                width="22"
                height="22"
                style="display: block; flex-shrink: 0"
            /></a>
          </div>
          <div
            style="
              display: flex;
              gap: 6px;
              align-items: center;
              padding-left: 16px;
              border-left: 1px solid #242424;
              font-size: 14px;
            "
          >
            <a
              href="#"
              style="
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 4px 10px 4px 7px;
                background: #242424;
                color: #f5f3f0;
              "
              ><img
                src="/_blob/701047e3379826ebc9feda7157870afd"
                alt=""
                width="16"
                height="16"
                style="display: block; flex-shrink: 0; filter: invert(1)"
              />household</a
            >
            <a
              href="#"
              style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px"
              ><img
                src="/_blob/61d45be9d1ac610cc020477a3e48ed70"
                alt=""
                width="16"
                height="16"
                style="display: block; flex-shrink: 0"
              />trip to osaka</a
            >
            <a
              href="#"
              style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px"
              ><img
                src="/_blob/701047e3379826ebc9feda7157870afd"
                alt=""
                width="16"
                height="16"
                style="display: block; flex-shrink: 0"
              />flat bills</a
            >
            <a
              href="#"
              style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px"
              ><img
                src="/_blob/61d45be9d1ac610cc020477a3e48ed70"
                alt=""
                width="16"
                height="16"
                style="display: block; flex-shrink: 0"
              />book club</a
            >
          </div>
          <div style="display: flex; align-items: center; gap: 4px; margin-left: auto">
            <strong style="font-size: 16px">moneylogs</strong>
            <button
              type="button"
              aria-label="Menu"
              aria-haspopup="menu"
              style="
                width: 44px;
                height: 44px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: 0;
              "
            >
              <img
                src="/_blob/55d0d9ee8ea194f06bc5846cf1f3be07"
                alt=""
                width="18"
                height="18"
                style="display: block; flex-shrink: 0"
              />
            </button>
          </div>
        </nav>
        <div
          role="status"
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 24px 0;
            padding: 6px 6px 6px 14px;
            font-size: 14px;
            border: 1px solid #242424;
            border-left: 4px solid #242424;
            background: #f5f3f0;
          "
        >
          <span style="flex-grow: 1">A new version is available.</span
          ><button
            type="button"
            style="
              height: 44px;
              padding: 0 16px;
              font: inherit;
              font-size: 12px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.04em;
              color: #242424;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              height: 36px;
              padding: 0 14px;
              border: 2px solid #242424;
              background: #ffffff;
            "
          >
            refresh
          </button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 20px; padding: 14px 24px 0">
          <header
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              height: 48px;
              box-sizing: border-box;
              padding: 7px 5px;
              border: 2px solid #242424;
              background: repeating-linear-gradient(180deg, #242424 0 1px, transparent 1px 4px);
              background-clip: content-box;
              flex-shrink: 0;
            "
          >
            <h1
              style="
                margin: 0 0 0 10px;
                padding: 0 10px;
                background: #f5f3f0;
                font-size: 18px;
                line-height: 28px;
                font-weight: 700;
              "
            >
              household
            </h1>
          </header>
          <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 32px">
            <div
              aria-hidden="true"
              style="height: 120px; border: 2px solid #242424; opacity: 0.35"
            ></div>
            <main style="display: flex; flex-direction: column; gap: 18px">
              <div style="display: flex; align-items: center; gap: 24px">
                <div style="display: flex; flex-direction: column">
                  <strong style="font-size: 22px">¥ 1,280</strong
                  ><span style="font-size: 12px; color: rgba(36, 36, 36, 0.7)"
                    >2% of ¥ 78,000 · 31 days left</span
                  >
                </div>
                <div style="flex-grow: 1">
                  <div
                    aria-hidden="true"
                    style="display: flex; height: 10px; border: 1px dashed #242424"
                  >
                    <div style="width: 1.2%; background: #89afd6"></div>
                    <div
                      style="width: 0.4%; background: #b27e6c; border-left: 1px solid #242424"
                    ></div>
                  </div>
                </div>
                <span style="font-weight: 700">‹ december 2026 ›</span>
              </div>
              <div
                aria-hidden="true"
                style="display: flex; flex-direction: column; gap: 10px; opacity: 0.35"
              >
                <div style="height: 44px; border: 1px solid #242424"></div>
                <div style="height: 30px; background: #242424"></div>
                <div style="height: 44px; border-bottom: 1px dotted #242424"></div>
                <div style="height: 44px; border-bottom: 1px dotted #242424"></div>
                <div style="height: 44px"></div>
              </div>
            </main>
            <aside
              style="
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
              "
            >
              <span style="font-size: 20px; padding-top: 8px">(^･o･^)ﾉ</span>
              <div
                role="dialog"
                aria-label="Budget buddy says"
                style="
                  position: relative;
                  width: 100%;
                  box-sizing: border-box;
                  padding: 12px 16px 14px;
                  background: #ffffff;
                  border: 1px solid #242424;
                  border-radius: 10px;
                "
              >
                <span
                  aria-hidden="true"
                  style="
                    position: absolute;
                    top: -13px;
                    left: 50%;
                    margin-left: -7px;
                    border-left: 7px solid transparent;
                    border-right: 7px solid transparent;
                    border-bottom: 13px solid #242424;
                  "
                ></span
                ><span
                  aria-hidden="true"
                  style="
                    position: absolute;
                    top: -11px;
                    left: 50%;
                    margin-left: -6px;
                    border-left: 6px solid transparent;
                    border-right: 6px solid transparent;
                    border-bottom: 12px solid #ffffff;
                  "
                ></span>
                <p style="margin: 0 0 12px; font-size: 14px">
                  november's all wrapped up! want to look back at it together?
                </p>
                <button
                  type="button"
                  style="
                    width: 100%;
                    height: 44px;
                    padding: 0 16px;
                    font: inherit;
                    font-size: 12px;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.04em;
                    color: #242424;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    height: 40px;
                    border: 2px solid #242424;
                    background: #ffffff;
                  "
                >
                  let's look
                </button>
                <div style="display: flex; justify-content: space-between; margin-top: 4px">
                  <button
                    type="button"
                    style="
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      height: 40px;
                      padding: 0 10px;
                      font: inherit;
                      font-size: 13px;
                      color: #242424;
                      background: none;
                      border: 0;
                      text-decoration: underline dotted;
                      text-underline-offset: 3px;
                      padding-left: 0;
                    "
                  >
                    ask me tomorrow</button
                  ><button
                    type="button"
                    style="
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      height: 40px;
                      padding: 0 10px;
                      font: inherit;
                      font-size: 13px;
                      color: #242424;
                      background: none;
                      border: 0;
                      text-decoration: underline dotted;
                      text-underline-offset: 3px;
                      padding-right: 0;
                    "
                  >
                    not this month
                  </button>
                </div>
              </div>
            </aside>
          </div>
        </div>
        <div style="position: absolute; left: 24px; bottom: 24px; width: 380px">
          <div
            role="status"
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              min-height: 48px;
              padding: 4px 4px 4px 12px;
              font-size: 13px;
              background: #f5f3f0;
              border: 2px solid #242424;
              box-shadow: 4px 4px 0 rgba(36, 36, 36, 0.25);
            "
          >
            <strong aria-hidden="true" style="width: 18px; text-align: center">✓</strong
            ><span style="flex-grow: 1">Sent to mika: “proud of you”</span
            ><button
              type="button"
              aria-label="Close"
              style="
                width: 40px;
                height: 40px;
                padding: 0;
                font: inherit;
                font-size: 16px;
                background: none;
                border: 0;
              "
            >
              ×
            </button>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview": {"width": 1440, "height": 900}}'
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
