<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Import sheet, proposed phone layout</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
          }
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
          }
          body {
            margin: 0;
          }
          a {
            color: #242424;
          }
          a:hover {
            color: #000;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          overflow: hidden;
          background: #f5f3f0;
          color: #242424;
          font-family: Hack, ui-monospace, Menlo, monospace;
          font-size: 14px;
          line-height: 1.5;
        "
      >
        <div
          aria-hidden="true"
          style="display: flex; flex-direction: column; gap: 10px; padding: 0 12px"
        >
          <div style="height: 44px; border-bottom: 1px solid #242424"></div>
          <div
            style="
              height: 44px;
              border: 2px solid #242424;
              background: repeating-linear-gradient(180deg, #242424 0 1px, transparent 1px 4px);
              background-clip: content-box;
              padding: 6px 4px;
              box-sizing: border-box;
            "
          ></div>
          <div style="height: 40px; border: 2px solid #242424"></div>
        </div>
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0.2);
          "
        >
          <section
            role="dialog"
            aria-modal="true"
            aria-labelledby="sheet-title"
            style="display: flex; flex-direction: column; max-height: 740px; background: #f5f3f0"
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-left: 14px;
                background: #242424;
                color: #f5f3f0;
                flex-shrink: 0;
              "
            >
              <h2
                id="sheet-title"
                style="
                  margin: 0;
                  font-size: 14px;
                  font-weight: 700;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                "
              >
                import spending
              </h2>
              <button
                type="button"
                aria-label="Close"
                style="
                  width: 44px;
                  height: 44px;
                  padding: 0;
                  font: inherit;
                  font-size: 18px;
                  color: #f5f3f0;
                  background: none;
                  border: 0;
                "
              >
                ×
              </button>
            </div>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 22px;
                padding: 16px 14px 20px;
                overflow: hidden;
                flex-grow: 1;
              "
            >
              <section style="display: flex; flex-direction: column; gap: 10px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    height: 48px;
                    padding: 0 12px;
                    border: 1px dashed #242424;
                    background: #ffffff;
                  "
                >
                  <strong>moneyforward-nov.csv</strong
                  ><span style="font-size: 12px; color: rgba(36, 36, 36, 0.7)"
                    >42 rows · change</span
                  >
                </div>
                <label
                  style="
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                    font-size: 12px;
                    color: rgba(36, 36, 36, 0.7);
                  "
                  >which way round are the dates?<span
                    style="
                      display: flex;
                      align-items: stretch;
                      height: 44px;
                      box-sizing: border-box;
                      border: 1px solid #242424;
                      background: #ffffff;
                      color: #242424;
                      font-size: 14px;
                    "
                    ><span style="flex-grow: 1; display: flex; align-items: center; padding: 0 12px"
                      >day / month / year</span
                    ><span
                      aria-hidden="true"
                      style="
                        width: 40px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-left: 1px solid #242424;
                      "
                      >▾</span
                    ></span
                  ></label
                >
              </section>
              <section style="display: flex; flex-direction: column; gap: 8px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: flex-end;
                    border-bottom: 1px solid #242424;
                  "
                >
                  <h3 style="margin: 0; padding-bottom: 4px; font-size: 13px; font-weight: 700">
                    already logged?
                  </h3>
                  <span style="padding-bottom: 4px; font-size: 12px; color: rgba(36, 36, 36, 0.7)"
                    >3</span
                  >
                </div>
                <p style="margin: 0; font-size: 12px; color: rgba(36, 36, 36, 0.7)">
                  These match an entry here on the same day and amount, so they're left out. Tick
                  any that are separate purchases.
                </p>
                <div>
                  <label
                    style="
                      display: flex;
                      align-items: center;
                      gap: 10px;
                      min-height: 44px;
                      border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
                    "
                    ><input
                      type="checkbox"
                      style="position: absolute; opacity: 0; width: 1px; height: 1px"
                    /><span aria-hidden="true" style="font-weight: 700">[ ]</span
                    ><span style="flex-grow: 1; min-width: 0">12 nov · coffee</span
                    ><strong style="font-variant-numeric: tabular-nums">¥ 480</strong></label
                  ><label
                    style="
                      display: flex;
                      align-items: center;
                      gap: 10px;
                      min-height: 44px;
                      border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
                    "
                    ><input
                      type="checkbox"
                      checked
                      style="position: absolute; opacity: 0; width: 1px; height: 1px"
                    /><span aria-hidden="true" style="font-weight: 700">[x]</span
                    ><span style="flex-grow: 1; min-width: 0">15 nov · groceries</span
                    ><strong style="font-variant-numeric: tabular-nums">¥ 3,210</strong></label
                  >
                </div>
              </section>
              <section style="display: flex; flex-direction: column; gap: 4px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: flex-end;
                    border-bottom: 1px solid #242424;
                  "
                >
                  <h3 style="margin: 0; padding-bottom: 4px; font-size: 13px; font-weight: 700">
                    categories
                  </h3>
                  <span style="padding-bottom: 4px; font-size: 12px; color: rgba(36, 36, 36, 0.7)"
                    >4 from the file</span
                  >
                </div>
                <div>
                  <div
                    style="
                      display: grid;
                      grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr);
                      gap: 8px;
                      align-items: center;
                      min-height: 44px;
                      border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
                    "
                  >
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                      >食費</span
                    ><span aria-hidden="true">→</span
                    ><span
                      style="
                        justify-self: start;
                        border-bottom: 1px solid #242424;
                        font-weight: 700;
                      "
                      >groceries ▾</span
                    >
                  </div>
                  <div
                    style="
                      display: grid;
                      grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr);
                      gap: 8px;
                      align-items: center;
                      min-height: 44px;
                      border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
                    "
                  >
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                      >外食</span
                    ><span aria-hidden="true">→</span
                    ><span
                      style="
                        justify-self: start;
                        border-bottom: 1px solid #242424;
                        font-weight: 700;
                      "
                      >dining out ▾</span
                    >
                  </div>
                  <div
                    style="
                      display: grid;
                      grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr);
                      gap: 8px;
                      align-items: center;
                      min-height: 44px;
                      border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
                    "
                  >
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                      >交通費</span
                    ><span aria-hidden="true">→</span
                    ><span
                      style="
                        justify-self: start;
                        border-bottom: 1px solid #242424;
                        font-weight: 700;
                      "
                      >transit ▾</span
                    >
                  </div>
                </div>
              </section>
            </div>
            <div
              style="
                display: flex;
                gap: 10px;
                padding: 12px 14px 16px;
                border-top: 1px solid #242424;
                flex-shrink: 0;
              "
            >
              <button
                type="button"
                style="
                  height: 44px;
                  padding: 0 16px;
                  font: inherit;
                  font-size: 12px;
                  font-weight: 700;
                  text-transform: uppercase;
                  letter-spacing: 0.04em;
                  color: #242424;
                  border: 1px solid #242424;
                  background: #f5f3f0;
                "
              >
                cancel
              </button>
              <button
                type="button"
                style="
                  flex-grow: 1;
                  height: 44px;
                  font: inherit;
                  font-size: 12px;
                  font-weight: 700;
                  text-transform: uppercase;
                  letter-spacing: 0.04em;
                  color: #242424;
                  border: 2px solid #242424;
                  background: #ffffff;
                "
              >
                import 40 entries
              </button>
            </div>
          </section>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() { return {}; }
      }
    </script>
  </body>
</html>
