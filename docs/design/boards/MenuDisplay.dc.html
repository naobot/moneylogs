    <script

      data-dc-script
      data-props='{"start": {"editor": "enum", "options": ["none", "menu", "display"], "default": "menu"}, "$preview": {"width": 390, "height": 844}}'
    >
      class Component extends DCLogic {
        constructor(props) { super(props); this.state = { open: null, theme: 0 }; }
        renderVals() {
          const s = this.state || {};
          const open = s.open == null ? (this.props.start ?? 'menu') : s.open;
          const t = s.theme || 0;
          const icons = ['/_blob/a24e291db61a86d30c0e0ada6135bca8', '/_blob/9e610b9be66b0172ec9f2d47df379bbc', '/_blob/8d329eb76c244b6472959fe7f71b2310'];
          const names = ['paper', 'mint', 'night shift'];
          const v = {
            isMenu: open === 'menu', isDisplay: open === 'display', menuOpen: open === 'menu' ? 'true' : 'false',
            caretBg: open === 'menu' ? '#242424' : 'none', caretFilter: open === 'menu' ? 'invert(1)' : 'none', caretTurn: open === 'menu' ? 'rotate(180deg)' : 'none',
            toggleMenu: () => this.setState({ open: open === 'menu' ? 'none' : 'menu' }),
            openDisplay: () => this.setState({ open: 'display' }), closeAll: () => this.setState({ open: 'none' }),
            themeIcon: icons[t], themeName: names[t], themeStep: (t + 1) + '/3',
            themeLabel: 'Theme: ' + names[t] + '. Switch to ' + names[(t + 1) % 3],
            cycle: () => this.setState({ theme: (t + 1) % 3 })
          };
          for (let j = 0; j < 3; j++) { const on = t === j; v['th_' + j + '_bg'] = on ? '#242424' : '#f5f3f0'; v['th_' + j + '_fg'] = on ? '#f5f3f0' : '#242424'; v['th_' + j + '_on'] = on ? 'true' : 'false'; v['th_' + j + '_pick'] = () => this.setState({ theme: j }); }
          return v;
        }
      }
