    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { theme: 'paper' };
        }
        renderVals() {
          const t = (this.state || {}).theme;
          const v = {};
          ['paper', 'colour', 'night'].forEach((k) => {
            const on = t === k;
            v[k + 'On'] = on ? 'true' : 'false';
            v[k + 'Bg'] = on ? '#242424' : '#f5f3f0';
            v[k + 'Fg'] = on ? '#f5f3f0' : '#242424';
            v['pick_' + k] = () => this.setState({ theme: k });
          });
          v.colourOn = t === 'colour';
          return v;
        }
      }
