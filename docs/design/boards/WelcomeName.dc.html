<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome wizard, name step, proposed phone layout</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
          }
          @font-face {
            font-family: Hack;
            src: url("ds/moneylogs/fonts/Hack-bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
          }
          body {
            margin: 0;
          }
          a {
            color: #242424;
          }
          a:hover {
            color: #000;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          background: #f5f3f0;
          color: #242424;
          font-family: Hack, ui-monospace, Menlo, monospace;
          font-size: 14px;
          line-height: 1.5;
        "
      >
        <main
          style="
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 12px 0;
            min-height: 0;
            flex-grow: 1;
            overflow: hidden;
          "
        >
          <header
            style="
              display: flex;
              align-items: center;
              height: 44px;
              box-sizing: border-box;
              padding: 6px 4px;
              border: 2px solid #242424;
              background: repeating-linear-gradient(180deg, #242424 0 1px, transparent 1px 4px);
              background-clip: content-box;
              flex-shrink: 0;
            "
          >
            <h1
              style="
                margin: 0 0 0 10px;
                padding: 0 10px;
                background: #f5f3f0;
                font-size: 16px;
                line-height: 28px;
                font-weight: 700;
              "
            >
              welcome
            </h1>
          </header>
          <ol
            aria-label="Steps"
            style="
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              margin: 0;
              padding: 0 0 12px;
              list-style: none;
              border-bottom: 1px dashed rgba(36, 36, 36, 0.3);
              flex-shrink: 0;
            "
          >
            <li
              aria-current="step"
              style="display: flex; flex-direction: column; align-items: center; gap: 2px"
            >
              <span
                style="
                  width: 28px;
                  height: 28px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: #242424;
                  color: #f5f3f0;
                  font-size: 12px;
                  font-weight: 700;
                "
                >1</span
              ><strong style="font-size: 11px">name</strong>
            </li>
            <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
              <span
                style="
                  width: 28px;
                  height: 28px;
                  box-sizing: border-box;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  border: 1px dashed #242424;
                  font-size: 12px;
                "
                >2</span
              ><span style="font-size: 11px; color: rgba(36, 36, 36, 0.7)">location</span>
            </li>
            <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
              <span
                style="
                  width: 28px;
                  height: 28px;
                  box-sizing: border-box;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  border: 1px dashed #242424;
                  font-size: 12px;
                "
                >3</span
              ><span style="font-size: 11px; color: rgba(36, 36, 36, 0.7)">display</span>
            </li>
            <li style="display: flex; flex-direction: column; align-items: center; gap: 2px">
              <span
                style="
                  width: 28px;
                  height: 28px;
                  box-sizing: border-box;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  border: 1px dashed #242424;
                  font-size: 12px;
                "
                >4</span
              ><span style="font-size: 11px; color: rgba(36, 36, 36, 0.7)">currency</span>
            </li>
          </ol>
          <h2
            style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; flex-shrink: 0"
          >
            welcome! what should we call you?
          </h2>
          <label
            style="
              display: flex;
              flex-direction: column;
              gap: 4px;
              font-size: 12px;
              color: rgba(36, 36, 36, 0.7);
            "
            >display name<input
              type="text"
              value="Nao"
              style="
                height: 44px;
                box-sizing: border-box;
                padding: 0 12px;
                font: inherit;
                font-size: 14px;
                color: #242424;
                border: 1px dashed #242424;
                border-radius: 0;
                background: #ffffff;
              "
          /></label>
          <p style="margin: 0; font-size: 13px; color: rgba(36, 36, 36, 0.7)">
            This is how you appear to everyone in your logs. You can change it later.
          </p>
        </main>
        <div
          style="
            display: flex;
            gap: 10px;
            padding: 12px 12px 16px;
            border-top: 1px solid #242424;
            flex-shrink: 0;
          "
        >
          <button
            type="button"
            disabled
            style="
              height: 44px;
              padding: 0 16px;
              font: inherit;
              font-size: 12px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.04em;
              color: #242424;
              border: 1px solid #242424;
              background: #f5f3f0;
              opacity: 0.3;
            "
          >
            back
          </button>
          <button
            type="button"
            style="
              flex-grow: 1;
              height: 44px;
              font: inherit;
              font-size: 12px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.04em;
              color: #242424;
              border: 2px solid #242424;
              background: #ffffff;
            "
          >
            next
          </button>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() { return {}; }
      }
    </script>
  </body>
</html>
