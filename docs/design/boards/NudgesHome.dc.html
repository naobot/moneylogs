                >
                <a
                  href="#"
                  role="menuitem"
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    height: 44px;
                    padding: 0 12px;
                    font-size: 13px;
                    font-weight: 400;
                    text-decoration: none;
                    border-top: 1px solid #242424;
                  "
                  >profile<span aria-hidden="true">›</span></a
                >
              </div></sc-if
            >
            <sc-if value="{{cheered}}" hint-placeholder-val="{{ false }}"
              ><p role="status" style="margin: 0; font-size: 12px; color: rgba(36, 36, 36, 0.7)">
                sent to ken: “proud of you”
              </p></sc-if
            >
          </section>
          <div
            aria-hidden="true"
            style="display: flex; flex-direction: column; gap: 10px; opacity: 0.35"
          >
            <div style="height: 26px; border-bottom: 1px solid #242424"></div>
            <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px">
              <div style="aspect-ratio: 1; border: 1px solid #242424"></div>
              <div style="aspect-ratio: 1; border: 1px solid #242424"></div>
              <div style="aspect-ratio: 1; border: 1px solid #242424"></div>
            </div>
          </div>
        </main>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"start": {"editor": "enum", "options": ["none", "nudge", "menu"], "default": "nudge"}, "$preview": {"width": 390, "height": 844}}'
    >
      class Component extends DCLogic {
        constructor(props) { super(props); this.state = { open: '', pokes: 0, cheered: false }; }
        renderVals() {
          const st = this.state || {};
          const o = st.open === '' || st.open === undefined ? (this.props.start || 'nudge') : st.open;
          const pokes = st.pokes || 0;
          const cOn = o === 'cheer';
          return {
            nudgeOpen: o === 'nudge', menuOpen: o === 'menu' || cOn, cheerOpen: cOn,
            cheerAria: cOn ? 'true' : 'false', cheerBg: cOn ? '#242424' : '#f5f3f0', cheerFg: cOn ? '#f5f3f0' : '#242424', cheerArrow: cOn ? '▴' : '▾',
            openNudge: () => this.setState({ open: o === 'nudge' ? 'none' : 'nudge' }),
            toggleMenu: () => this.setState({ open: o === 'menu' || cOn ? 'none' : 'menu' }),
            toggleCheer: () => this.setState({ open: cOn ? 'menu' : 'cheer' }),
            pokeLabel: pokes > 0 ? 'poked ×' + pokes : 'poke',
            poke: () => this.setState({ pokes: pokes + 1 }),
            sent: () => this.setState({ open: 'none', cheered: true }), cheered: !!st.cheered,
            closeAll: () => this.setState({ open: 'none' })
          };
        }
      }
    </script>
  </body>
</html>
