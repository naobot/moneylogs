<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>moneylogs</title>
    <meta
      name="description"
      content="A calm spending tracker with a gentle social side. Log what you spent and why, in any currency, and share it with a few friends if you like."
    />

    <!-- Link previews (Open Graph + X/Twitter). Crawlers don't run JS, so these are
         static and shared by every route; og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="moneylogs" />
    <meta property="og:title" content="moneylogs" />
    <meta
      property="og:description"
      content="A calm spending tracker with a gentle social side. Log what you spent and why, in any currency, and share it with a few friends if you like."
    />
    <meta property="og:url" content="https://moneylogs.app/" />
    <meta property="og:image" content="https://moneylogs.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The moneylogs wordmark and pixel-art logo in a terminal-style window."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <div id="modal-root"></div>
  </body>
</html>
